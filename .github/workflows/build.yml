name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: build:mac
            artifact: cat_catch-mac
          - os: windows-latest
            build_script: build:win
            artifact: cat_catch-win
          - os: ubuntu-latest
            build_script: build:linux
            artifact: cat_catch-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build:mac / build:win / build:linux 内部依次执行：
      # electron-vite build → 下载 Chromium 到 playwright-browsers/（各平台 job 各自下载对应二进制，
      # Linux 上 scripts/fetch-playwright-browsers.mjs 会自动加 --with-deps 用 apt 补齐系统库）→ electron-builder 打包。
      # 与本地 `pnpm build:mac` 共用同一套脚本，保证本地/CI 行为一致。
      - name: Build & package (${{ matrix.build_script }})
        run: pnpm run ${{ matrix.build_script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cat_catch-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
